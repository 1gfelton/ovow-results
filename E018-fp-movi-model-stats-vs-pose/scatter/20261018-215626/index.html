    return `<tr><td>${esc(s.label)}<span class="kind">${s.kind}</span></td><td>${c.n}</td><td>${f2(c.rho)}${bar}</td>`
      + `<td>${c.ci ? `[${f2(c.ci[0])}, ${f2(c.ci[1])}]` : '–'}</td><td>${f2(c.within)}${c.within_n ? ` <span class="mute">(${c.within_n})</span>` : ''}</td>`
      + `<td>${f2(c.rho_easy)} <span class="mute">(${c.n_easy})</span></td><td>${v ? f2(v.rho) : '–'}</td><td>${pd ? `${f2(pd.mean)} [${f2(pd.ci[0])}, ${f2(pd.ci[1])}]` : '–'}</td></tr>`;
  }).join('');
  $('ctab').innerHTML = `<thead><tr><th>statistic vs ${YL[Y]}</th><th>n</th><th style="text-transform:none;font-size:.85rem">ρ</th><th>95% CI</th><th>within object (objects)</th><th>GT-trackable only (n)</th><th>variant level</th><th>|ρ chamfer| − |ρ| (95% CI)</th></tr></thead><tbody>${rows}</tbody>`;
}

// scale helpers
function scale(vals, log) {
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (log) { lo = Math.log10(Math.max(lo, 1)); hi = Math.log10(Math.max(hi, 1)); }
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.04; return [lo - pad, hi + pad];
}
function ticks(lo, hi, log) {
  if (log) { const t = []; for (let e = Math.ceil(lo); e <= hi; e++) t.push(e); return t.map(e => [e, e >= 3 ? (10 ** (e - 3)) + 'K' : String(10 ** e)]); }
  const step0 = (hi - lo) / 4, mag = 10 ** Math.floor(Math.log10(step0)), st = [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= step0);
  const t = []; for (let v = Math.ceil(lo / st) * st; v <= hi + 1e-9; v += st) t.push([v, +v.toFixed(6) + '']); return t;
}
function panel(s) {
  const W = 340, H = 230, ml = 46, mr = 8, mt = 8, mb = 30, pw = W - ml - mr, ph = H - mt - mb;
  let P;
  if (LV === 'obj') P = D.points.filter(p => p[s.k] != null && p[Y] != null && gOn.has(vg[p.v]));
  else P = D.variant_rows.filter(r => r[s.k] != null && r[Y] != null && gOn.has(vg[r.v]));
  if (LV === 'var' && s.k === 'vis') return `<div class="panel"><div class="t">${esc(s.label)}</div><p class="mute" style="font-size:.85rem">Not a variant property (same for every variant).</p></div>`;
  const xs = P.map(p => p[s.k]), [x0, x1] = xs.length ? scale(xs, s.log) : [0, 1];
  const X = v => ml + pw * ((s.log ? Math.log10(Math.max(v, 1)) : v) - x0) / (x1 - x0), Yp = v => mt + ph * (1 - v / 1.0);
  // deterministic jitter so the bimodal 0 / 1 piles separate a little
  const jit = (p, i) => LV === 'obj' ? (((p.o * 7919 + p.v * 104729) % 1000) / 1000 - 0.5) * 0.03 : 0;
  let g = '';
  [0, 0.25, 0.5, 0.75, 1].forEach(t => { g += `<line class="ax" x1="${ml}" x2="${ml + pw}" y1="${Yp(t)}" y2="${Yp(t)}"/><text x="${ml - 5}" y="${Yp(t) + 3}" text-anchor="end">${t}</text>`; });
  ticks(x0, x1, s.log).forEach(([v, lab]) => { const x = s.log ? ml + pw * (v - x0) / (x1 - x0) : X(v); if (x >= ml - 1 && x <= ml + pw + 1) g += `<line class="ax" x1="${x}" x2="${x}" y1="${mt + ph}" y2="${mt + ph + 4}"/><text x="${x}" y="${mt + ph + 15}" text-anchor="middle">${lab}</text>`; });
  g += `<text x="${ml + pw / 2}" y="${H - 2}" text-anchor="middle">${esc(s.label)}</text>`;
  g += `<text x="12" y="${mt + ph / 2}" text-anchor="middle" transform="rotate(-90 12 ${mt + ph / 2})">${YL[Y]}</text>`;
  // binned means (object level): 6 quantile bins
  if (LV === 'obj' && P.length > 30) {
    const so = P.slice().sort((a, b) => a[s.k] - b[s.k]), nb = 6, pts = [];
    for (let b = 0; b < nb; b++) { const q = so.slice(Math.floor(b * so.length / nb), Math.floor((b + 1) * so.length / nb)); if (!q.length) continue;
      const mx = q.reduce((a, p) => a + (s.log ? Math.log10(Math.max(p[s.k], 1)) : p[s.k]), 0) / q.length, my = q.reduce((a, p) => a + p[Y], 0) / q.length;
      pts.push([ml + pw * (mx - x0) / (x1 - x0), Yp(my)]); }
    g += `<polyline class="bm" points="${pts.map(p => p.join(',')).join(' ')}"/>` + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--mean)"/>`).join('');
  }
  P.forEach((p, i) => {
    const col = LV === 'var' ? 'var(--s1)' : p.gt == null ? 'var(--faint)' : p.gt >= D.gt_ok ? 'var(--s1)' : 'var(--s2)';
    const r = LV === 'var' ? 5 : 4;
    g += `<circle class="dot" data-i="${i}" cx="${X(p[s.k]).toFixed(1)}" cy="${(Yp(Math.min(1, Math.max(0, p[Y] + jit(p, i))))).toFixed(1)}" r="${r}" fill="${col}" fill-opacity="${LV === 'var' ? 1 : .7}"/>`;
    if (LV === 'var') g += `<text x="${X(p[s.k]) + 7}" y="${Yp(p[Y]) + 3}" style="font-size:9px">${esc(p.label)}</text>`;
  });
  const c = LV === 'obj' ? D.corr[s.k + '|' + Y] : D.vcorr[s.k + '|' + Y];
  const rtxt = c && c.rho != null ? `ρ ${f2(c.rho)}${LV === 'obj' && c.ci ? ` [${f2(c.ci[0])}, ${f2(c.ci[1])}]` : ''} · n ${c.n} (all groups)` : '';
  return `<div class="panel" data-k="${s.k}"><div class="t">${esc(s.label)}<span class="kind">${s.kind}</span></div><div class="r">${rtxt}</div>`
    + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.label)} vs ${YL[Y]}">${g}</svg></div>`;
}
function render() {
  $('leg').innerHTML = LV === 'obj'
    ? `<span><span class="sw" style="background:var(--s1)"></span>FoundationPose - GT CAD</span>`
      + `<span><span class="sw" style="background:var(--s2)"></span>Very hard objects</span>`
      + `<span><span class="sw" style="background:var(--mean);border-radius:0;height:2px;width:14px"></span>mean ${YL[Y]}</span>`
    : `<span>One point per variant: median statistic over built models vs pooled frame-level ${YL[Y]} (failed models count as failed frames).</span>`;
  $('grid').innerHTML = D.stats.map(panel).join('');
}
$('ysel').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; Y = b.dataset.y; $('ysel').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); });
$('lsel').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; LV = b.dataset.l; $('lsel').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); });
$('gsel').addEventListener('change', e => { const g = +e.target.dataset.g; e.target.checked ? gOn.add(g) : gOn.delete(g); render(); });
$('grid').addEventListener('mousemove', e => {
  const c = e.target.closest('circle.dot'); if (!c) { tip.style.display = 'none'; return; }
  const k = c.closest('.panel').dataset.k, s = D.stats.find(t => t.k === k);
  const P = LV === 'obj' ? D.points.filter(p => p[k] != null && p[Y] != null && gOn.has(vg[p.v])) : D.variant_rows.filter(r => r[k] != null && r[Y] != null && gOn.has(vg[r.v]));
  const p = P[+c.dataset.i]; if (!p) return;
  const fx = v => v == null ? '–' : Math.abs(v) >= 100 ? Math.round(v) : v.toFixed(3);
  tip.innerHTML = LV === 'obj'
    ? `<b>${esc(D.objects[p.o].asset)}</b><br>${esc(D.objects[p.o].scene)} #${D.objects[p.o].inst} · ${esc(D.variants[p.v])}<br>${esc(s.label)} ${fx(p[k])}<br>register ${Math.round(100 * p.reg)}% · track ${Math.round(100 * p.trk)}%<br>gt-mesh track ${p.gt == null ? '–' : Math.round(100 * p.gt) + '%'}`
    : `<b>${esc(p.label)}</b><br>${esc(p.group)}<br>${esc(s.label)} ${fx(p[k])}<br>register ${p.reg} · track ${p.trk} · built ${esc(p.built || '–')}`;
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
$('grid').addEventListener('mouseleave', () => { tip.style.display = 'none'; });
render();
</script></body></html>
